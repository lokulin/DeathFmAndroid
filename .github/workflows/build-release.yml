name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'          # e.g. v1.0.0, v1.2.3
  workflow_dispatch:      # allows manual runs from the Actions tab

permissions:
  contents: write         # required so the workflow can create a release

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Debug-signed, not a Play Store release build - there's no release
      # keystore set up for this project yet (it isn't published anywhere),
      # so this is meant for sideloading rather than store distribution.
      # Revisit if/when this ever needs a real signing config.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK with version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "DeathFmAndroid-${version}-debug.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DeathFmAndroid-*.apk
          generate_release_notes: true
